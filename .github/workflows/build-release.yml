name: Build and Release WinRemote Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.2.0)'
        required: true
        type: string
      pre_release:
        description: '预发布版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_FILE: 'WinRemoteSharp.csproj'
  EXE_NAME: 'WinRemoteAgent.exe'
  RUNTIME: 'win-x64'

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于生成 changelog

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Build (Debug - verify compilation)
        run: dotnet build ${{ env.PROJECT_FILE }} -c Debug --no-restore

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT_FILE }} -c Release --no-restore

      - name: Publish single-file self-contained
        run: |
          dotnet publish ${{ env.PROJECT_FILE }} `
            -c Release `
            -r ${{ env.RUNTIME }} `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:PublishTrimmed=false `
            -o ./publish

      - name: Verify EXE exists
        run: |
          $exe = "./publish/${{ env.EXE_NAME }}"
          if (-not (Test-Path $exe)) {
            Write-Error "EXE not found at $exe"
            exit 1
          }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "✅ EXE found: $exe ($size MB)"
          echo "EXE_PATH=$exe" >> $env:GITHUB_ENV
          echo "EXE_SIZE_MB=$size" >> $env:GITHUB_ENV

      - name: Generate checksums
        run: |
          $exe = $env:EXE_PATH
          $algos = @("MD5", "SHA1", "SHA256", "SHA512")
          $checksums = @()
          foreach ($algo in $algos) {
            $hash = Get-FileHash -Algorithm $algo -Path $exe
            $checksums += "$($algo.ToLower())  $($hash.Hash.ToLower())  ${{ env.EXE_NAME }}"
          }
          $checksums -join "`n" | Set-Content -Path ./checksums.txt -Encoding UTF8
          Get-Content ./checksums.txt
          echo "CHECKSUM_PATH=./checksums.txt" >> $env:GITHUB_ENV

      - name: Create version info
        run: |
          $ver = @{
            Version = "${{ github.ref_name }}"
            BuildDate = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
            Runtime = "${{ env.RUNTIME }}"
            Configuration = "Release"
            FileSize = (Get-Item $env:EXE_PATH).Length
            FileSizeMB = $env:EXE_SIZE_MB
            DotNetVersion = "8.0"
            TargetFramework = "net8.0-windows"
            CommitSHA = "${{ github.sha }}"
          } | ConvertTo-Json -Depth 3
          $ver | Set-Content -Path ./version.json -Encoding UTF8
          Get-Content ./version.json
          echo "VERSION_PATH=./version.json" >> $env:GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinRemoteAgent-${{ github.ref_name }}-${{ env.RUNTIME }}
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.CHECKSUM_PATH }}
            ${{ env.VERSION_PATH }}
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: WinRemoteAgent-${{ github.ref_name }}-${{ env.RUNTIME }}
          path: ./release-assets

      - name: Verify assets
        run: |
          ls -la ./release-assets/
          sha256sum ./release-assets/*

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..${{ github.ref_name }} | head -20)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -20)
          fi
          
          cat << EOF > release_notes.md
          ## WinRemote Agent ${{ github.ref_name }}

          **发布日期**: $(date '+%Y-%m-%d')
          **目标平台**: Windows x64 (.NET 8 自包含)
          **构建提交**: ${{ github.sha }}

          ### 📦 下载
          | 文件 | 大小 | 说明 |
          |------|------|------|
          | \`${{ env.EXE_NAME }}\` | ${{ env.EXE_SIZE_MB }} MB | 单文件自包含可执行程序 |

          ### ✨ 功能特性
          - 🖥️ WPF 图形界面 + 系统托盘
          - 🔧 系统服务安装/管理 (NSSM)
          - ⌨️ 键盘/鼠标模拟
          - 📸 屏幕截图
          - 💻 远程命令执行
          - 📁 文件读取（白名单）
          - 🔔 系统通知

          ### 🔐 校验和
          \`\`\`
          $(cat ./release-assets/checksums.txt)
          \`\`\`

          ### 📋 更新日志
          $CHANGELOG

          ---
          *完整提交历史: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD)}...${{ github.ref_name }}*
          EOF
          
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: WinRemote Agent ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            ./release-assets/${{ env.EXE_NAME }}
            ./release-assets/checksums.txt
            ./release-assets/version.json
          draft: false
          prerelease: ${{ github.event.inputs.pre_release || false }}
          generate_release_notes: false

      - name: Create Pre-release (workflow_dispatch)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: WinRemote Agent v${{ github.event.inputs.version }}
          body_path: release_notes.md
          files: |
            ./release-assets/${{ env.EXE_NAME }}
            ./release-assets/checksums.txt
            ./release-assets/version.json
          draft: false
          prerelease: ${{ github.event.inputs.pre_release }}
          generate_release_notes: false